<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>

.bottom{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;gap:10px}
.eventlog{width:min(460px,56vw);padding:10px 12px;border-radius:14px}.eventlog .head{font:800 9px ui-monospace,monospace;color:#7cf8c7;letter-spacing:.13em;margin-bottom:6px}.event{font:11px ui-monospace,monospace;color:#9db0a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0}.event:first-of-type{color:#effff7}
.agentcard{display:none;width:260px;padding:12px;border-radius:16px}.agentcard.on{display:block}.agentcard .name{font-weight:800;font-size:17px}.agentcard .meta{font:10px ui-monospace,monospace;color:#8ea39a;margin:2px 0 9px}.bars{display:grid;grid-template-columns:64px 1fr 34px;gap:5px 7px;align-items:center;font:9px ui-monospace,monospace;color:#8da098}.bar{height:5px;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5ce9ba,#d6ff75)}.thought{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);font:11px/1.35 ui-monospace,monospace;color:#cfe5da}
.hint{position:absolute;right:16px;top:90px;font:10px ui-monospace,monospace;color:rgba(210,235,224,.55);pointer-events:none;text-align:right}.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 130px 45px rgba(0,0,0,.52)}

</style></head><body>
<div id="wrap">
<canvas id="c"></canvas><div class="vignette"></div>
<div class="topbar"><div class="brand glass"><b>TINY GODS // LIVE</b><span id="worldId">WORLD</span></div><div class="stats" id="stats"></div></div>
<div class="hint">CLICK: inspect · DRAG: pan<br>WHEEL: zoom · SPACE: pause</div>
<div class="bottom"><div class="eventlog glass"><div class="head">CHRONICLE</div><div id="events"></div></div><div class="agentcard glass" id="agentcard"></div></div>
</div>
<script>
const CFG=__TINY_GODS_CONFIG__;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=1200,H=800,dpr=1,paused=false,last=0,simT=0,day=0,selected=null;
let camera={x:0,y:0,z:1},drag=null;
const TAU=Math.PI*2;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(CFG.seed), rr=(a,b)=>a+(b-a)*R(), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){let n=Math.sin(x*127.1+y*311.7+CFG.seed*.017)*43758.5453;return n-Math.floor(n)}
function noise(x,y){let x0=Math.floor(x),y0=Math.floor(y),xf=x-x0,yf=y-y0;let u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);let a=hash(x0,y0),b=hash(x0+1,y0),c=hash(x0,y0+1),d=hash(x0+1,y0+1);return lerp(lerp(a,b,u),lerp(c,d,u),v)}
function fbm(x,y){let v=0,a=.55;for(let i=0;i<4;i++){v+=noise(x,y)*a;x*=2.04;y*=2.04;a*=.5}return v}
const world={w:1900,h:1200,food:[],trees:[],rocks:[],agents:[],settlements:[],ruins:[],trails:new Map(),events:[],innovations:0,conflicts:0,births:0,deaths:0,nextAgentId:CFG.population};
function terrain(x,y){let nx=x/world.w-.5,ny=y/world.h-.5;let island=1.08-Math.sqrt(nx*nx*1.4+ny*ny*2.0)*1.32;return fbm(x/360,y/360)*.62+fbm(x/95,y/95)*.16+island*.44}
function wet(x,y){return fbm((x+900)/260,(y-250)/260)}
function isLand(x,y){return terrain(x,y)>.64}
function name(){const a=['Ash','Bram','Cinder','Dove','Ember','Fen','Glim','Hush','Ivy','Jun','Kest','Lumen','Moss','Nox','Orin','Pip','Quill','Reed','Sable','Tern','Umber','Vale','Wren','Yarrow','Zeph'];const b=['a','en','ik','o','ra','u','et','in'];return a[Math.floor(R()*a.length)]+(R()<.55?b[Math.floor(R()*b.length)]:'')}
function placeLand(){for(let i=0;i<500;i++){let x=rr(80,world.w-80),y=rr(80,world.h-80);if(isLand(x,y))return{x,y}}return{x:world.w/2,y:world.h/2}}
for(let i=0;i<520;i++){let p=placeLand();if(wet(p.x,p.y)>.38)world.trees.push({...p,s:rr(.6,1.5),t:R()});}
for(let i=0;i<180;i++){let p=placeLand();world.food.push({...p,q:rr(.4,1),phase:rr(0,TAU)});}
for(let i=0;i<65;i++){let p=placeLand();world.rocks.push({...p,s:rr(.5,1.3)});}
function makeAgent(p,opts={}){let id=opts.id??world.nextAgentId++;return{id,n:opts.n||name(),x:p.x,y:p.y,vx:0,vy:0,a:rr(0,TAU),energy:opts.energy??rr(.55,1),age:opts.age??rr(15,38),social:opts.social??clamp(CFG.cooperation+rr(-.25,.25),0,1),aggro:opts.aggro??clamp(CFG.aggression+rr(-.2,.2),0,1),curious:opts.curious??clamp(CFG.innovation+rr(-.25,.25),0,1),carry:0,knowledge:opts.knowledge??(R()<.08?1:0),home:opts.home||null,memory:opts.memory||[],friends:new Map(),alive:true,halo:rr(0,TAU),parentA:opts.parentA||null,parentB:opts.parentB||null,generation:opts.generation||0,lastTrail:null,birthCooldown:opts.birthCooldown||rr(5,20)}}
for(let i=0;i<CFG.population;i++){let p=placeLand();world.agents.push(makeAgent(p,{id:i}));}
function log(msg){world.events.unshift(msg);world.events=world.events.slice(0,4);document.getElementById('events').innerHTML=world.events.map(e=>`<div class="event">${e}</div>`).join('')}
log(`Genesis ${CFG.seed}: ${CFG.population} wanderers awaken.`);
function nearest(arr,a,maxD){let best=null,bd=maxD*maxD;for(const b of arr){if(b===a||b.alive===false)continue;let dx=b.x-a.x,dy=b.y-a.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=b}}return best}
function thought(a){if(a.energy<.25)return 'I need food.';if(a.carry>.5)return a.home?'Bringing food home.':'I should find others.';if(a.aggro>.7&&CFG.scarcity>.6)return 'Resources feel too scarce to share.';if(a.social>.7)return 'Safer together.';if(a.curious>.72)return 'What lies beyond the ridge?';return ['The wind changed.','I remember where berries grew.','Following the warm ground.','Someone was here recently.'][a.id%4]}
function addMemory(a,m){a.memory.unshift(m);a.memory=a.memory.slice(0,4)}
function trailKey(x,y){return `${Math.floor(x/18)},${Math.floor(y/18)}`}
function leaveTrail(a,dt){let k=trailKey(a.x,a.y);if(k!==a.lastTrail){let q=world.trails.get(k)||{x:Math.floor(a.x/18)*18+9,y:Math.floor(a.y/18)*18+9,w:0};q.w=clamp(q.w+dt*.8,0,1);world.trails.set(k,q);a.lastTrail=k}}
function maybeBirth(a,b,dt){if(!a.home||a.home!==b.home||a.age<18||b.age<18||a.age>58||b.age>58)return;if(a.birthCooldown>0||b.birthCooldown>0||a.energy<.68||b.energy<.68||a.home.store<.35)return;let chance=dt*.022*CFG.cooperation*(1-CFG.scarcity*.65);if(R()>chance)return;let p={x:(a.x+b.x)/2+rr(-8,8),y:(a.y+b.y)/2+rr(-8,8)};if(!isLand(p.x,p.y))p={x:a.home.x+rr(-15,15),y:a.home.y+rr(-15,15)};let child=makeAgent(p,{age:0,energy:.82,social:clamp((a.social+b.social)/2+rr(-.12,.12),0,1),aggro:clamp((a.aggro+b.aggro)/2+rr(-.1,.1),0,1),curious:clamp((a.curious+b.curious)/2+rr(-.12,.12),0,1),knowledge:Math.max(0,Math.min(a.knowledge,b.knowledge)-1),home:a.home,parentA:a,parentB:b,generation:Math.max(a.generation,b.generation)+1,birthCooldown:22});world.agents.push(child);a.energy-=.12;b.energy-=.08;a.home.store-=.2;a.birthCooldown=26;b.birthCooldown=26;world.births++;addMemory(a,`${child.n} was born`);addMemory(b,`${child.n} was born`);log(`✹ ${child.n} was born in ${a.home.n}, child of ${a.n} and ${b.n}.`)}
function update(dt){simT+=dt;day=simT/28;const season=(Math.sin(day*.22)+1)/2;for(const f of world.food){f.q=clamp(f.q+dt*(.006*(1-CFG.scarcity))*(.5+season),0,1)}
for(const a of [...world.agents]){if(!a.alive)continue;a.age+=dt*.055;a.birthCooldown=Math.max(0,a.birthCooldown-dt);a.energy-=dt*(.0042+CFG.scarcity*.0025);leaveTrail(a,dt);let target=null,mode='wander';
let food=nearest(world.food.filter(f=>f.q>.12),a,240);if(a.energy<.68&&food&&food.q>.12){target=food;mode='food'}
let near=nearest(world.agents,a,150);if(near&&a.social>.55&&a.energy>.25){if(!target){target=near;mode='social'}}
if(a.home&&a.carry>.25&&a.energy>=.35){target=a.home;mode='home'}
if(target){let dx=target.x-a.x,dy=target.y-a.y,len=Math.hypot(dx,dy)||1;a.vx+=dx/len*dt*(mode==='food'?22:12);a.vy+=dy/len*dt*(mode==='food'?22:12)}else{a.a+=(R()-.5)*dt*1.6+(a.curious-.5)*.06;a.vx+=Math.cos(a.a)*dt*(6+12*a.curious);a.vy+=Math.sin(a.a)*dt*(6+12*a.curious)}
a.vx*=Math.pow(.78,dt);a.vy*=Math.pow(.78,dt);let nx=a.x+a.vx*dt*8,ny=a.y+a.vy*dt*8;if(isLand(nx,ny)){a.x=nx;a.y=ny}else{a.a+=Math.PI*.7;a.vx*=-.4;a.vy*=-.4}
a.x=clamp(a.x,20,world.w-20);a.y=clamp(a.y,20,world.h-20);
if(food&&Math.hypot(food.x-a.x,food.y-a.y)<15&&food.q>.08){let bite=Math.min(food.q,.18);food.q-=bite;a.energy=clamp(a.energy+bite*.65,0,1);a.carry=clamp(a.carry+bite*.45,0,1)}
if(near&&Math.hypot(near.x-a.x,near.y-a.y)<25){let affinity=(a.social+near.social)/2-(a.aggro+near.aggro)/4;if(affinity>.38){a.friends.set(near.id,(a.friends.get(near.id)||0)+dt);maybeBirth(a,near,dt);if(a.energy>.62&&near.energy<.35&&a.carry>.15&&R()<dt*.08*CFG.cooperation){let gift=.08;a.carry-=gift;near.energy+=gift;addMemory(a,`Shared food with ${near.n}`)}if(a.knowledge>near.knowledge&&R()<dt*.025*CFG.innovation){near.knowledge=a.knowledge;world.innovations++;log(`✦ ${a.n} taught ${near.n} a new trick.`)}}else if(R()<dt*.018*(CFG.aggression+CFG.scarcity)){a.energy-=.07;near.energy-=.05;world.conflicts++;addMemory(a,`Clashed with ${near.n}`);log(`⚡ ${a.n} and ${near.n} fought over scarce ground.`)}}
if(!a.home&&a.friends.size>=3&&a.energy>.5&&R()<dt*.008*CFG.cooperation){let nearbyFriends=[...world.agents].filter(b=>b.alive&&Math.hypot(b.x-a.x,b.y-a.y)<100&&a.friends.has(b.id));if(nearbyFriends.length>=2){let s={id:world.settlements.length,n:name()+' Hollow',founder:a,x:a.x,y:a.y,pop:0,store:.2,age:0,hue:Math.floor(rr(22,345)),peak:0,abandoned:false};world.settlements.push(s);a.founded=(a.founded||0)+1;a.home=s;for(const b of nearbyFriends)if(!b.home&&R()<.7)b.home=s;log(`⌂ ${s.n} was founded by ${a.n} and friends.`)}}
if(a.home){a.home.age+=dt*.0002;if(Math.hypot(a.x-a.home.x,a.y-a.home.y)<28&&a.carry>.08){a.home.store=clamp(a.home.store+a.carry,0,3);a.carry=0}if(a.energy<.3&&a.home.store>.05&&Math.hypot(a.x-a.home.x,a.y-a.home.y)<55){let take=Math.min(.12,a.home.store);a.home.store-=take;a.energy+=take}}
if(a.knowledge<4&&R()<dt*.0008*a.curious*CFG.innovation){a.knowledge++;world.innovations++;log(`✦ ${a.n} discovered ${['a shortcut','better gathering','shared markings','a shelter trick'][Math.min(3,a.knowledge-1)]}.`)}
if(a.energy<=0||a.age>82+R()*18){a.alive=false;world.deaths++;log(`· ${a.n} passed from the terrarium at age ${Math.floor(a.age)}.`)}}
for(const s of world.settlements){let prev=s.pop;s.pop=world.agents.filter(a=>a.alive&&a.home===s).length;s.peak=Math.max(s.peak||0,s.pop);if(prev>0&&s.pop===0&&!s.abandoned){s.abandoned=true;world.ruins.push({x:s.x,y:s.y,n:s.n,peak:s.peak,day:Math.floor(day)+1,hue:s.hue});log(`⌁ ${s.n} fell silent. Its ruins remain.`)}}
if(R()<dt*.00045*(1-CFG.climate)){let drought=R()<.55;if(drought){for(const f of world.food)f.q*=.7;log('☀ A dry spell swept across the terrarium.')}else{for(const f of world.food)f.q=clamp(f.q+.25,0,1);log('☂ Long rain woke the food fields.')}}
}
function sx(x){return (x-world.w/2-camera.x)*camera.z+W/2}function sy(y){return (y-world.h/2-camera.y)*camera.z+H/2}
function draw(){let cycle=(Math.sin(day*.42-Math.PI/2)+1)/2;let sky=cycle;ctx.fillStyle=`rgb(${Math.floor(5+sky*6)},${Math.floor(10+sky*13)},${Math.floor(15+sky*12)})`;ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(W/2,H/2);ctx.scale(camera.z,camera.z);ctx.translate(-world.w/2-camera.x,-world.h/2-camera.y);
// Terrain is static. Rasterize once; retain smooth coastlines at every zoom level.
if(!world.landscape)world.landscape=paintLandscape();
ctx.drawImage(world.landscape,0,0);
for(const t of world.trails.values()){if(t.w<.08)continue;ctx.fillStyle=`rgba(208,184,132,${.035+t.w*.13})`;ctx.beginPath();ctx.arc(t.x,t.y,1.2+t.w*2.2,0,TAU);ctx.fill()}
for(const r0 of world.ruins){ctx.strokeStyle=`hsla(${r0.hue} 30% 70% / .24)`;ctx.lineWidth=1;ctx.strokeRect(r0.x-8,r0.y-5,8,7);ctx.strokeRect(r0.x+2,r0.y-3,7,6);ctx.beginPath();ctx.moveTo(r0.x-10,r0.y+6);ctx.lineTo(r0.x+11,r0.y+6);ctx.stroke()}
for(const r of world.rocks){ctx.fillStyle='rgba(105,123,115,.42)';ctx.beginPath();ctx.arc(r.x,r.y,4*r.s,0,TAU);ctx.fill()}
for(const t of world.trees){let sway=Math.sin(simT*.7+t.t*8)*1.5;ctx.strokeStyle='rgba(16,28,23,.9)';ctx.lineWidth=2*t.s;ctx.beginPath();ctx.moveTo(t.x,t.y+6*t.s);ctx.lineTo(t.x+sway,t.y-5*t.s);ctx.stroke();ctx.fillStyle=`rgba(${35+Math.floor(t.t*20)},${92+Math.floor(t.t*38)},${67+Math.floor(t.t*18)},.92)`;ctx.beginPath();ctx.arc(t.x+sway,t.y-8*t.s,6*t.s,0,TAU);ctx.fill()}
for(const f of world.food){if(f.q<.05)continue;let pulse=.7+.3*Math.sin(simT*1.8+f.phase);ctx.fillStyle=`rgba(190,245,102,${.15+f.q*.5})`;ctx.beginPath();ctx.arc(f.x,f.y,2.2+f.q*2*pulse,0,TAU);ctx.fill()}
for(const s of world.settlements){if(s.pop<=0)continue;let rad=15+Math.sqrt(s.pop)*4;ctx.fillStyle=`hsla(${s.hue} 68% 58% / .055)`;ctx.beginPath();ctx.arc(s.x,s.y,rad*3.1,0,TAU);ctx.fill();ctx.strokeStyle=`hsla(${s.hue} 65% 64% / .16)`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(s.x,s.y,rad*2.2,0,TAU);ctx.stroke();for(let i=0;i<Math.min(12,s.pop+2);i++){let an=i*2.399,rd=7+Math.sqrt(i)*6,px=s.x+Math.cos(an)*rd,py=s.y+Math.sin(an)*rd;ctx.fillStyle='rgba(83,58,38,.95)';ctx.fillRect(px-3,py-2,7,6);ctx.fillStyle=`rgba(255,${160+Math.floor(40*cycle)},80,.9)`;ctx.fillRect(px-1,py-1,2,2)}ctx.fillStyle='rgba(231,255,242,.72)';ctx.font='10px ui-monospace';ctx.fillText(`${s.n} · ${s.pop}`,s.x-rad,s.y-rad-9);if(cycle<.48){let glow=ctx.createRadialGradient(s.x,s.y,1,s.x,s.y,36+rad);glow.addColorStop(0,`rgba(255,172,74,${.28*(1-cycle)})`);glow.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(s.x,s.y,36+rad,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,196,92,.9)';ctx.beginPath();ctx.arc(s.x,s.y,2.3,0,TAU);ctx.fill()}}
for(const a of world.agents){if(!a.alive)continue;let pulse=.5+.5*Math.sin(simT*2+a.halo);if(selected===a){ctx.strokeStyle='rgba(124,248,199,.9)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(a.x,a.y,12+pulse*3,0,TAU);ctx.stroke()}let hue=a.home?a.home.hue:150+a.knowledge*18-a.aggro*55;ctx.fillStyle=`hsl(${hue} 72% ${58+cycle*8}%)`;ctx.beginPath();ctx.arc(a.x,a.y,4.2,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,220,.7)';ctx.beginPath();ctx.arc(a.x+1.3,a.y-1.4,1.1,0,TAU);ctx.fill();if(a.carry>.2){ctx.fillStyle='#d7ff71';ctx.fillRect(a.x-5,a.y-7,2,2)}}
ctx.restore();
let night=1-cycle;ctx.fillStyle=`rgba(5,11,31,${night*.28})`;ctx.fillRect(0,0,W,H);
if(night>.35){for(let i=0;i<24;i++){let x=(hash(i,3)*W+simT*(i%3+1))%W,y=hash(i,8)*H;ctx.fillStyle=`rgba(173,255,206,${night*(.08+.25*hash(i,11))})`;ctx.beginPath();ctx.arc(x,y,1+hash(i,4),0,TAU);ctx.fill()}}
updateHUD(cycle)}
function updateHUD(cycle){let alive=world.agents.filter(a=>a.alive).length,avg=alive?world.agents.filter(a=>a.alive).reduce((s,a)=>s+a.energy,0)/alive:0;document.getElementById('stats').innerHTML=[['DAY',Math.floor(day)+1],['ALIVE',alive],['CAMPS',world.settlements.filter(s=>s.pop>0).length],['BIRTHS',world.births],['IDEAS',world.innovations],['RUINS',world.ruins.length]].map(([k,v])=>`<div class="stat glass"><small>${k}</small><strong>${v}</strong></div>`).join('');document.getElementById('worldId').textContent=`WORLD ${CFG.seed} · ${cycle<.25?'NIGHT':cycle>.72?'DAYLIGHT':'TWILIGHT'} · ${paused?'PAUSED':CFG.speed+'×'}`;if(selected){let a=selected;document.getElementById('agentcard').classList.toggle('on',a.alive);document.getElementById('agentcard').innerHTML=`<div class="name">${a.n}</div><div class="meta">AGE ${Math.floor(a.age)} · GEN ${a.generation} · KNOWLEDGE ${a.knowledge}<br>${a.home?a.home.n:'WANDERER'}${a.parentA?` · CHILD OF ${a.parentA.n} + ${a.parentB.n}`:''}</div><div class="bars">${[['ENERGY',a.energy],['SOCIAL',a.social],['AGGRO',a.aggro],['CURIOSITY',a.curious]].map(([k,v])=>`<span>${k}</span><span class="bar"><i style="width:${Math.round(v*100)}%"></i></span><b>${Math.round(v*100)}</b>`).join('')}</div><div class="thought">“${thought(a)}”${a.memory[0]?`<br><span style="color:#779086">memory: ${a.memory[0]}</span>`:''}</div>`}}
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.z=clamp(camera.z*(e.deltaY>0?.9:1.1),.15,2.8)},{passive:false});
canvas.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y}});addEventListener('mouseup',()=>drag=null);addEventListener('mousemove',e=>{if(drag){camera.x=drag.cx-(e.clientX-drag.x)/camera.z;camera.y=drag.cy-(e.clientY-drag.y)/camera.z}});
canvas.addEventListener('click',e=>{if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)return;let r=canvas.getBoundingClientRect(),wx=(e.clientX-r.left-W/2)/camera.z+world.w/2+camera.x,wy=(e.clientY-r.top-H/2)/camera.z+world.h/2+camera.y;selected=nearest(world.agents,{x:wx,y:wy},30/camera.z);document.getElementById('agentcard').classList.toggle('on',!!selected)});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();paused=!paused}});
// Fixed simulation steps keep random decisions and per-step actions independent of display FPS.
const simClock=createSimulationClock(1/60);
function frame(ts){let dt=last?Math.min(.25,(ts-last)/1000):0;last=ts;simClock.advance(dt,CFG.speed,paused,update);draw();requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{last=0;simClock.reset()});
requestAnimationFrame(frame);
</script></body></html>
